name: Feature request
description: Suggest a focused improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or workflow gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would you like the dashboard to do?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Agent or tool involved (optional)
      placeholder: Cline inside Cursor, Claude Code, OpenRouter…
